<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Browser chrome colour, one per scheme. It was a single hardcoded #000000,
      which was wrong in light mode and would have been wrong in exactly one of
      the two once a theme existed. ThemeContext updates these when the user
      chooses explicitly, since a media query cannot see that choice.
    -->
    <meta name="theme-color" content="#282c34" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />

    <!--
      Theme, applied before first paint.

      Deliberately an inline, non-module, non-deferred script. A module script
      is deferred by spec and would run AFTER the first paint, which is the
      white flash this exists to prevent -- and on a dark-mode device that flash
      is the whole screen.

      localStorage is the source of truth for paint because it is the only one
      readable synchronously. Firestore holds the account-level preference and
      reconciles once auth resolves; see ThemeContext.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("squadron-tracker:theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
          // No stored choice: the prefers-color-scheme block in tokens.css
          // handles it, so nothing to set here.
        } catch (e) {
          // Private browsing can make localStorage throw on read. Falling
          // through to the media query is the correct outcome, not an error.
        }
      })();
    </script>
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of  in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Squadron Tracker</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
